jobs:
  build:
  # … (생략)

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 1) EC2에 ~/app 폴더 미리 만들어 두기
      - name: Create app directory on EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          script: |
            mkdir -p ~/app

      # 2) scp-action 으로 JAR 복사
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.5
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          source:   "app.jar"                            # 워크러너에 있는 파일
          target:   "/home/${{ secrets.EC2_SSH_USER }}/app/app.jar"  # EC2의 정확한 경로까지 파일명 지정

      # 3) SSH로 배포 스크립트 실행
      - name: Restart Service on EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          script: |
            cd ~/app

            # 이전 JAR 백업
            if [ -f app.jar ]; then
              mv app.jar app-$(date +'%Y%m%d%H%M%S').jar
            fi

            # 새 JAR은 이미 ~/app/app.jar 로 복사되어 있으므로 바로 실행 준비
            chmod 644 app.jar

            # 기존 프로세스 종료
            pkill -f 'java -jar .*app.jar' || true

            # 새 JAR 실행
            nohup java -jar app.jar \
              --spring.profiles.active=secure \
              >> deploy.log 2>&1 &