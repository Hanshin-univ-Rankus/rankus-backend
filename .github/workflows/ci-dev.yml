# .github/workflows/ci-aws.yml
name: CI AWS Build & Deploy to EC2

on:
  push:
    branches: [ aws ]

env:
  AWS_REGION:      ap-northeast-2
  S3_BUCKET:       ${{ secrets.S3_BUCKET }}
  EC2_HOST:        ${{ secrets.EC2_HOST }}
  EC2_USER:        ${{ secrets.EC2_SSH_USER }}
  LOCAL_JAR_PATH:  rankus/build/libs/app.jar
  JAR_NAME:        app.jar

jobs:
  build-upload:
    name: 📦 Build & Upload to S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Build application JAR (Gradle)
        run: |
          cd rankus
          chmod +x ./gradlew
          ./gradlew clean bootJar

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Upload JAR to S3
        run: |
          aws s3 cp ${{ env.LOCAL_JAR_PATH }} \
            s3://${{ env.S3_BUCKET }}/${{ env.JAR_NAME }}

      - name: Verify S3 upload
        run: |
          aws s3 ls s3://${{ env.S3_BUCKET }}/${{ env.JAR_NAME }}

  deploy:
    name: 🚀 Download & Deploy to EC2
    needs: build-upload
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials (for S3 download)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Download JAR from S3
        run: |
          aws s3 cp s3://${{ env.S3_BUCKET }}/${{ env.JAR_NAME }} \
            ./${{ env.JAR_NAME }}

      - name: Verify downloaded JAR
        run: |
          ls -lh ${{ env.JAR_NAME }}

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # ✅ 새로 추가: app 디렉토리 보장 + 오래된 백업/로그 정리 (최근 5개만 보관)
      - name: Ensure app dir & cleanup old backups/log
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << EOF
          set -e
          APP_DIR="/home/${{ env.EC2_USER }}/app"
          mkdir -p "\$APP_DIR"
          cd "\$APP_DIR"

          # 백업 JAR 정리: 최신 5개만 남기고 삭제
          if ls app.jar-backup-*.jar >/dev/null 2>&1; then
            ls -t app.jar-backup-*.jar | tail -n +6 | xargs -r rm -f
          fi

          # 로그 슬림화: 최근 5000라인만 유지
          if [ -f deploy.log ]; then
            tail -n 5000 deploy.log > deploy.log.tmp && mv deploy.log.tmp deploy.log
          fi
          EOF

      - name: Copy JAR to EC2 (as app-new.jar)
        run: |
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            ${{ env.JAR_NAME }} \
            ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/home/${{ env.EC2_USER }}/app/app-new.jar

      - name: SSH into EC2 & Redeploy
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << EOF
          set -e

          # 작업 디렉토리로 이동
          cd /home/${{ env.EC2_USER }}/app

          # 1) 기존 애플리케이션 종료 (에러 무시)
          pkill -f "java -jar ${{ env.JAR_NAME }}" || true

          # 2) 기존 JAR 백업
          if [ -f ${{ env.JAR_NAME }} ]; then
            mv ${{ env.JAR_NAME }} "${{ env.JAR_NAME }}-backup-$(date +'%Y%m%d%H%M%S').jar"
          fi

          # 3) 새 JAR 교체
          mv app-new.jar ${{ env.JAR_NAME }}

          # 4) 환경 변수 설정
          export SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}"
          export SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}"
          export SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}"
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export MAILJET_API_KEY="${{ secrets.MAILJET_API_KEY }}"
          export MAILJET_SECRET_KEY="${{ secrets.MAILJET_SECRET_KEY }}"
          export MAILJET_FROM_EMAIL="${{ secrets.MAILJET_FROM_EMAIL }}"
          export MAILJET_FROM_NAME="${{ secrets.MAILJET_FROM_NAME }}"

          # 5) 애플리케이션 실행 (백그라운드)
          nohup java -jar ${{ env.JAR_NAME }} --spring.profiles.active=aws \
            >> deploy.log 2>&1 &

          echo "✅ Deployment completed at $(date)"
          EOF