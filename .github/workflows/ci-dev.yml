jobs:
  build:
  # … (생략)

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 1) 먼저 S3에서 JAR 내려받기
      - name: Configure AWS credentials (for S3 download)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-northeast-2

      - name: Download JAR from S3
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET }}/app.jar ./app.jar

      # 2) scp-action 으로 EC2에 JAR 업로드
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.5
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          source:   "app.jar"                                   # 로컬 파일
          target:   "/home/${{ secrets.EC2_SSH_USER }}/app/"     # EC2 경로 (폴더)

      # 3) ssh-action 으로 원격 명령 실행
      - name: Restart Service on EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          script: |
            # 작업 디렉터리로 이동
            mkdir -p ~/app
            cd ~/app

            # 이전 JAR 백업
            if [ -f app.jar ]; then
              mv app.jar app-$(date +'%Y%m%d%H%M%S').jar
            fi

            # 복사된 JAR을 app.jar 로 이름 변경
            mv ~/app/app.jar .

            # 프로세스 종료 후 재실행
            pkill -f 'java -jar .*app.jar' || true
            nohup java -jar ./app.jar \
              --spring.profiles.active=secure \
              >> ./deploy.log 2>&1 &