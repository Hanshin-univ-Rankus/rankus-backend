# .github/workflows/ci-dev.yml
name: CI Dev Build & Deploy

on:
  push:
    branches: [ dev ]

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ${{ secrets.S3_BUCKET }}

jobs:
  build:
    name: Build & Upload to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Build application JAR
        run: |
          cd rankus
          ./gradlew clean bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Upload JAR to S3
        run: |
          aws s3 cp rankus/build/libs/app.jar s3://${{ env.S3_BUCKET }}/app.jar

      - name: Verify S3 upload
        run: |
          aws s3 ls s3://${{ env.S3_BUCKET }}/app.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # … (AWS 자격증명 & S3 다운로드 등 생략)

      - name: Copy JAR to EC2 (as temp file)
        run: |
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            ./app.jar \
            ${{ secrets.EC2_SSH_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/app/app-new.jar

      - name: SSH into EC2 & Restart Service
        run: |
          ssh -t -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_SSH_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          cd /home/ec2-user/app

          # 1) 기존 app.jar 백업
          if [ -f app.jar ]; then
            mv app.jar app-$(date +'%Y%m%d%H%M%S').jar
          fi

          # 2) 새로 복사된 app-new.jar 를 app.jar 로 교체
          mv app-new.jar app.jar

          # 3) 환경변수 로드 (필요시 .env 파일 사용해도 됩니다)
          export SPRING_DATASOURCE_URL='${{ secrets.SPRING_DATASOURCE_URL }}'
          export SPRING_DATASOURCE_USERNAME='${{ secrets.SPRING_DATASOURCE_USERNAME }}'
          export SPRING_DATASOURCE_PASSWORD='${{ secrets.SPRING_DATASOURCE_PASSWORD }}'
          export JWT_SECRET='${{ secrets.JWT_SECRET }}'

          # 4) 이전 프로세스 종료 & 새 앱 기동
          pkill -f 'java -jar app.jar' || true
          nohup java -jar app.jar --spring.profiles.active=dev >> deploy.log 2>&1 &

          EOF