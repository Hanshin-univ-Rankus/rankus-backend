name: CI Dev Build & Deploy to AWS

# dev 브랜치에 푸시될 때 실행
on:
  push:
    branches: [ aws ]

env:
  AWS_REGION:       ap-northeast-2
  S3_BUCKET:        ${{ secrets.S3_BUCKET }}
  EC2_HOST:         ${{ secrets.EC2_HOST }}
  EC2_USER:         ${{ secrets.EC2_SSH_USER }}
  LOCAL_JAR_PATH:   rankus/build/libs/app.jar
  REMOTE_APP_DIR:   /home/${{ env.EC2_USER }}/app
  JAR_NAME:         app.jar

jobs:
  build-upload:
    name: 📦 Build & Upload to S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Build application JAR (Gradle)
        run: |
          cd rankus
          chmod +x ./gradlew
          ./gradlew clean bootJar

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Upload JAR to S3
        run: |
          aws s3 cp ${{ env.LOCAL_JAR_PATH }} \
            s3://${{ env.S3_BUCKET }}/${{ env.JAR_NAME }}

      - name: Verify S3 upload
        run: |
          aws s3 ls s3://${{ env.S3_BUCKET }}/${{ env.JAR_NAME }}

  deploy:
    name: 🚀 Download & Deploy to EC2
    needs: build-upload
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Download JAR from S3
        run: |
          aws s3 cp s3://${{ env.S3_BUCKET }}/${{ env.JAR_NAME }} \
            ./${{ env.JAR_NAME }}

      - name: Verify downloaded JAR
        run: |
          ls -lh ${{ env.JAR_NAME }}

      - name: Copy JAR to EC2 (as app-new.jar)
        run: |
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            ${{ env.JAR_NAME }} \
            ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.REMOTE_APP_DIR }}/app-new.jar

      - name: SSH into EC2 & Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'EOF'
          set -e

          cd $REMOTE_APP_DIR

          # 1) 기존 프로세스 종료 (에러 발생해도 계속)
          pkill -f "java -jar $JAR_NAME" || true

          # 2) 이전 JAR 백업
          if [ -f $JAR_NAME ]; then
            mv $JAR_NAME ${JAR_NAME%.jar}-backup-$(date +"%Y%m%d%H%M%S").jar
          fi

          # 3) 새 JAR 교체
          mv app-new.jar $JAR_NAME

          # 4) 환경변수 설정
          export SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}"
          export SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}"
          export SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}"
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"

          # 5) 애플리케이션 시작 (백그라운드)
          nohup java -jar $JAR_NAME --spring.profiles.active=aws \
            >> deploy.log 2>&1 &

          echo "✅ Deployment completed at $(date)"
          EOF