# .github/workflows/ci-dev.yml
name: CI Dev Build & Deploy

# dev 브랜치에 push 될 때마다 실행
on:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Build JAR & Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Build application JAR
        run: |
          cd rankus
          ./gradlew clean bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-jar
          path: rankus/build/libs/app.jar

  deploy:
    name: Download & Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v3
        with:
          name: app-jar

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Copy JAR to EC2
        run: |
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            app-jar/app.jar \
            ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/app/app.jar

      - name: SSH into EC2 & Restart Service
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
          
            set -e

            # 배포 디렉터리로 이동
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app

            # 이전 JAR 백업
            if [ -f app.jar ]; then
              mv app.jar app-$(date +'%Y%m%d%H%M%S').jar
            fi

            # 환경변수 설정 (GitHub Secrets 로부터 전달)
            export SPRING_DATASOURCE_URL='${{ secrets.SPRING_DATASOURCE_URL }}'
            export SPRING_DATASOURCE_USERNAME='${{ secrets.SPRING_DATASOURCE_USERNAME }}'
            export SPRING_DATASOURCE_PASSWORD='${{ secrets.SPRING_DATASOURCE_PASSWORD }}'
            export JWT_SECRET='${{ secrets.JWT_SECRET }}'

            # 기존 프로세스 종료
            pkill -f 'java -jar app.jar' || true

            # 새로운 JAR 백그라운드 실행
            nohup java -jar app.jar \
              --spring.profiles.active=dev \
              >> deploy.log 2>&1 &

            EOF