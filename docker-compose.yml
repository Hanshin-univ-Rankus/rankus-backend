services:
  mysql:
    image: mysql:8.0
    container_name: rankus-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: rankus
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  mysql_test:
    image: mysql:8.0
    container_name: rankus-db-test
    profiles: ["test"]
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: rankus_test
      MYSQL_USER: rankus_test_user
      MYSQL_PASSWORD: test_password
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3308:3306"
    volumes:
      - db-data-test:/var/lib/mysql

volumes:
  db-data:
  db-data-test:
