spring:
  config:
    activate:
      on-profile: aws

  datasource:
    url: ${SPRING_DATASOURCE_URL}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        connection.characterEncoding: UTF-8
        connection.CharSet: UTF-8
        connection.useUnicode: true

  mail:
    host: in-v3.mailjet.com
    port: 587
    username: ${MAILJET_API_KEY}
    password: ${MAILJET_SECRET_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: in-v3.mailjet.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        debug: false

# Mailjet 설정
mailjet:
  from:
    email: ${MAILJET_FROM_EMAIL}
    name: ${MAILJET_FROM_NAME}

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}  # 레거시 호환
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:60000}    # 15분 (새로운 액세스 토큰)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:60000} # 7일 (리프레시 토큰)
