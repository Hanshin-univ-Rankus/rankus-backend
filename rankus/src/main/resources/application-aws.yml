spring:
  config:
    activate:
      on-profile: aws

  datasource:
    url: ${SPRING_DATASOURCE_URL}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        connection.characterEncoding: UTF-8
        connection.CharSet: UTF-8
        connection.useUnicode: true

  mail:
    host: in-v3.mailjet.com
    port: 587
    username: ${MAILJET_API_KEY}
    password: ${MAILJET_SECRET_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: in-v3.mailjet.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        debug: false

# Mailjet 설정
mailjet:
  from:
    email: ${MAILJET_FROM_EMAIL}
    name: ${MAILJET_FROM_NAME}

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}  # 레거시 호환
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:604800000}    # 15분 (새로운 액세스 토큰) 현재 7일로 임시 처리
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7일 (리프레시 토큰)

rankus:
  qr:
    # ================= QR Secure Token Key 설정 =================
    # 반드시 32바이트(ASCII 기준) 고정 길이 키를 환경 변수 또는 비밀 저장소를 통해 주입해야 합니다.
    # 1) GitHub Actions 예시 (deploy job):
    #    - name: Set QR secret
    #      run: echo "QR_SECRET_KEY=$QR_SECRET_KEY" >> $GITHUB_ENV
    #      (Settings > Secrets and variables > Actions 에 QR_SECRET_KEY 등록)
    # 2) AWS SSM Parameter Store 예시:
    #    aws ssm put-parameter --name /rankus/prod/qr-secret-key --value "<32-byte-key>" --type SecureString
    #    (EC2 UserData 또는 ECS Task Definition 에서 export QR_SECRET_KEY 로 주입)
    # 3) AWS Secrets Manager 사용 시 (Spring Cloud AWS 도입 시):
    #    spring.config.import=aws-secretsmanager:rankus/prod   (해당 시크릿 JSON 내 { "QR_SECRET_KEY": "<키>" })
    # 4) 키 길이 검증 실패 시 애플리케이션이 기동되지 않습니다.
    # 5) 로컬(application.yml)에서는 임시 하드코딩 가능하지만 application-aws.yml 에서는 절대 하드코딩 금지.
    # 6) 예시 32바이트 키 (절대 실서비스 사용 금지): RankusSecureQRKey2025_Prod__32X
    #    문자수 확인: echo -n 'RankusSecureQRKey2025_Prod__32X' | wc -c  -> 32
    secret-key: ${QR_SECRET_KEY:?QR Secret(32 bytes) must be provided in environment}
    # (옵션) 레거시 단순 QR 토큰 허용 여부 - 점진적 비활성화 계획 시 false 로 변경
    # legacy-enabled: true

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    try-it-out-enabled: true
  packages-to-scan: org.univ.rankus.adapter.in.web
  paths-to-match: /api/**
