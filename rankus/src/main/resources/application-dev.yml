spring:
  datasource:
    url: jdbc:mysql://localhost:3307/rankus_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: rankus_dev_user # 개발용 DB 사용자 이름 (실제 환경에 맞게 변경 필요)
    password: dev_password # 개발용 DB 비밀번호 (실제 환경에 맞게 변경 필요)
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop # 데이터베이스 스키마 생성만 하고 종료 시 삭제하지 않음
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true # SQL 로깅 활성화
    generate-ddl: true # DDL 생성 활성화
    properties:
      hibernate:
        format_sql: true # SQL 로깅 포맷팅
    defer-datasource-initialization: true # SQL 스크립트 실행 전 JPA가 스키마를 생성하도록 함

  sql:
    init:
      mode: always # 항상 data.sql 실행
      data-locations: classpath:data.sql # data.sql 파일 위치 지정
      encoding: UTF-8

server:
  address: 0.0.0.0
  port: 8080

security:
  jwt:
    secret: "yDeGly34tDXIxkjo6MQKgBNCI+2iMFLdT0i8zD2JZuE=" # JWT 비밀 키 (실제 환경에 맞게 변경 필요)
    expiration-ms: 3600000  # 1시간

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG # Spring Web 관련 로그 레벨 설정
    org.hibernate.SQL: DEBUG # Hibernate SQL 로그 레벨 설정
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # Hibernate SQL 바인딩 로그 레벨 설정